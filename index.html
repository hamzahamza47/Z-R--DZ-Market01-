<title>ZØRØ DZ Market01 | المتجر الجزائري</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7f6;color:#202820}
header{background:#087f5b;color:white;padding:18px 12px;text-align:center}
header h1{margin:0;font-size:25px}
header p{margin:8px 0 0;font-size:14px}
nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:12px;background:white;position:sticky;top:0;z-index:5;box-shadow:0 2px 5px #ddd}
button,select{border:0;border-radius:8px;padding:11px;cursor:pointer;font-size:14px}
nav button,.primary{background:#087f5b;color:white}
main{max-width:1100px;margin:auto;padding:16px}
.hero{background:#d9f5e8;border-radius:15px;padding:25px 18px;margin-bottom:18px}
.hero h2{color:#086644;margin-top:0}
input{padding:12px;border:1px solid #ddd;border-radius:8px;width:100%;font-size:15px}
.categories{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.categories button{background:white;border:1px solid #ddd;white-space:nowrap}
h2.section{font-size:21px}
.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0000000c}
.card img{width:100%;height:135px;object-fit:cover;background:#eee}
.card .info{padding:12px}
.card h3{font-size:16px;margin:0 0 8px}
